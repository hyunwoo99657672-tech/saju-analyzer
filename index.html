<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>천명 사주 분석</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#0b0b0b;color:#f4efe4}
    main{max-width:980px;margin:auto;padding:30px 18px 80px}
    h1{font-size:42px;margin:20px 0 8px;color:#d6b26b} .sub{color:#aaa;line-height:1.7}
    .card{background:#171512;border:1px solid #443827;padding:24px;margin-top:24px}
    label{display:block;font-size:13px;color:#c9bea8;margin:14px 0}
    input,select{width:100%;padding:13px;margin-top:7px;background:#0f0f0f;border:1px solid #46413a;color:#fff}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    button{width:100%;padding:16px;background:linear-gradient(90deg,#a57a32,#dfbd78);border:0;font-weight:800;margin-top:15px}
    .result{display:none;margin-top:28px}.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .pillar{background:#15130f;border:1px solid #3b3022;padding:18px;text-align:center}.pillar b{display:block;font-size:34px;margin:8px 0}
    .section{background:#12110f;border:1px solid #302a22;padding:22px;margin-top:14px;line-height:1.9;color:#bbb}
    .section h2{color:#e1c18a;font-size:22px;margin:0 0 10px}.bars{margin-top:16px}.bar{display:grid;grid-template-columns:28px 1fr 30px;gap:10px;align-items:center;margin:10px 0}
    .track{height:8px;background:#302b24}.fill{height:100%;background:#c79a50}
    .notice{font-size:11px;color:#777;line-height:1.6;margin-top:14px}
    @media(max-width:650px){.grid,.pillars{grid-template-columns:1fr 1fr}h1{font-size:34px}}
  </style>
</head>
<body>
<main>
  <div>
    <div style="letter-spacing:4px;color:#b99352;font-size:12px">CHEONMYEONG</div>
    <h1>천명 사주 분석</h1>
    <p class="sub">생년월일과 태어난 시간을 입력하면 사주 원국과 오행, 성격, 인간관계, 연애·결혼, 재물·직업을 분석합니다.</p>
  </div>

  <form class="card" id="form">
    <div class="grid">
      <label>이름
        <input id="name" value="현우">
      </label>
      <label>성별
        <select id="gender"><option value="male">남성</option><option value="female">여성</option></select>
      </label>
    </div>
    <div class="grid">
      <label>생년월일
        <input id="date" type="date" value="1990-03-05" required>
      </label>
      <label>태어난 시간
        <input id="time" type="time" value="09:30" required>
      </label>
    </div>
    <label>가장 궁금한 분야
      <input id="focus" value="연애, 사업, 결혼">
    </label>
    <button type="submit">나의 사주 분석하기</button>
    <p class="notice">사주는 전통적 해석 도구이며 과학적 진단이나 미래의 확정적 예언이 아닙니다.</p>
  </form>

  <section id="result" class="result">
    <div class="card">
      <h2 id="title"></h2>
      <p id="summary" class="sub"></p>
      <div class="pillars" id="pillars"></div>
      <div class="bars" id="bars"></div>
    </div>
    <div id="sections"></div>
  </section>
</main>

<script type="module">
  import { calculateFourPillars, getHeavenlyStemElement, getEarthlyBranchElement } from "https://esm.sh/manseryeok@2.0.0";

  const stemInfo={
    갑:["목","큰 나무","개척성과 추진력이 강하고 성장 욕구가 큽니다."],
    을:["목","덩굴과 화초","유연하고 관계 감각이 뛰어나며 끈기가 있습니다."],
    병:["화","태양","표현력과 리더십이 강하며 분위기를 끌어올립니다."],
    정:["화","촛불","섬세하고 몰입력이 좋으며 감정의 깊이가 있습니다."],
    무:["토","큰 산","안정감과 책임감이 강하며 쉽게 흔들리지 않습니다."],
    기:["토","논밭","실용적이고 관리 능력이 좋으며 사람을 돌보는 힘이 있습니다."],
    경:["금","강철","결단력과 승부욕이 강하고 기준이 분명합니다."],
    신:["금","보석","정교하고 미적 감각이 뛰어나며 완성도를 중시합니다."],
    임:["수","큰 바다","확장성과 정보력이 좋으며 자유로운 사고를 합니다."],
    계:["수","비와 이슬","직관과 관찰력이 뛰어나고 섬세한 감수성이 있습니다."]
  };
  const elementText={
    목:{good:"성장, 기획, 교육, 확장",bad:"고집과 마무리 부족",job:"교육·코칭, 브랜딩, 콘텐츠, 신규사업"},
    화:{good:"표현력, 홍보력, 속도, 리더십",bad:"성급함과 과열",job:"영업·마케팅, 서비스업, 영상·미디어"},
    토:{good:"운영, 신뢰, 현실 감각, 자산 관리",bad:"변화에 둔감하고 걱정이 많음",job:"운영관리, 공간사업, 부동산, 조직관리"},
    금:{good:"판단력, 분석, 정리, 결단",bad:"완벽주의와 날카로운 말",job:"재무·법무, 데이터, 기술, 컨설팅"},
    수:{good:"정보력, 통찰, 소통, 유연성",bad:"생각 과다와 실행 지연",job:"상담·연구, IT, 무역, 기획"}
  };
  const gen={목:"화",화:"토",토:"금",금:"수",수:"목"};
  const control={목:"토",토:"수",수:"화",화:"금",금:"목"};

  function stemOf(p){return p?.heavenlyStem||p?.stem||""}
  function branchOf(p){return p?.earthlyBranch||p?.branch||""}
  function countElements(c){
    const x={목:0,화:0,토:0,금:0,수:0};
    ["year","month","day","hour"].forEach(k=>{
      const p=c[k], a=getHeavenlyStemElement(stemOf(p)), b=getEarthlyBranchElement(branchOf(p));
      if(a in x)x[a]++; if(b in x)x[b]++;
    }); return x;
  }
  function maxKeys(o){const m=Math.max(...Object.values(o));return Object.keys(o).filter(k=>o[k]===m)}
  function minKeys(o){const m=Math.min(...Object.values(o));return Object.keys(o).filter(k=>o[k]===m)}

  document.querySelector("#form").addEventListener("submit",e=>{
    e.preventDefault();
    try{
      const [y,m,d]=document.querySelector("#date").value.split("-").map(Number);
      const [h,min]=document.querySelector("#time").value.split(":").map(Number);
      const chart=calculateFourPillars({year:y,month:m,day:d,hour:h,minute:min,isLunar:false,gender:document.querySelector("#gender").value,dayBoundary:"midnight"});
      const ds=stemOf(chart.day), info=stemInfo[ds], elem=info[0], counts=countElements(chart);
      const strong=maxKeys(counts), weak=minKeys(counts), name=document.querySelector("#name").value||"사용자";
      document.querySelector("#title").textContent=`${name}님의 사주 분석`;
      document.querySelector("#summary").textContent=`사주의 중심은 ${ds}${elem}입니다. ${info[1]}에 비유되며, ${info[2]}`;
      document.querySelector("#pillars").innerHTML=[
        ["시주",chart.hour],["일주",chart.day],["월주",chart.month],["년주",chart.year]
      ].map(([t,p])=>`<div class="pillar"><span>${t}</span><b>${stemOf(p)}${branchOf(p)}</b><small>${getHeavenlyStemElement(stemOf(p))} · ${getEarthlyBranchElement(branchOf(p))}</small></div>`).join("");
      const total=Object.values(counts).reduce((a,b)=>a+b,0);
      document.querySelector("#bars").innerHTML=Object.entries(counts).map(([k,v])=>`<div class="bar"><span>${k}</span><div class="track"><div class="fill" style="width:${v/total*100}%"></div></div><b>${v}</b></div>`).join("");
      const sections=[
        ["타고난 성격과 기질",`${info[2]} 핵심 강점은 ${elementText[elem].good}입니다. 반면 과해질 경우 ${elementText[elem].bad}이 나타날 수 있습니다. 강한 오행은 ${strong.join(", ")}, 약한 오행은 ${weak.join(", ")}입니다.`],
        ["인간관계",`잘 맞는 사람은 ${gen[elem]} 기운이 건강한 사람입니다. 당신의 생각을 행동으로 연결하고 분위기를 부드럽게 만들어 줍니다. 피해야 할 사람은 책임은 피하면서 통제하려는 사람, 약속을 자주 바꾸는 사람, 감정으로 압박하는 사람입니다.`],
        ["연애와 결혼",`연애에서는 애매한 관계보다 신뢰와 행동이 분명한 상대가 잘 맞습니다. 결혼 후에는 돈, 역할, 가족 문제를 말없이 넘기지 말고 구체적으로 합의하는 것이 중요합니다. 질투와 통제가 심하거나 경제관념이 불분명한 상대는 주의하세요.`],
        ["재물운과 직업운",`적합한 분야는 ${elementText[elem].job}입니다. 조직에서는 책임자나 운영 역할, 독립한다면 전문성을 상품화한 서비스형 사업이 유리합니다. 당장 시작하기 좋은 일은 상담·코칭 상품, 지역 기반 콘텐츠, 반복 업무를 프로그램이나 템플릿으로 판매하는 방식입니다.`],
        ["건강과 생활 관리",`강한 오행이 반복될 때 과로와 감정 과열을 조절하세요. 부족한 ${weak.join(", ")} 기운은 규칙적인 수면, 운동, 식사, 기록 습관으로 보완하는 것이 좋습니다. 건강 관련 내용은 전통적 해석일 뿐 의학적 진단이 아닙니다.`],
        ["삶의 방향",`당신의 능력을 혼자만의 감각으로 끝내지 않고 시스템과 자산으로 바꾸는 것이 중요합니다. 즉흥적인 성과보다 신뢰가 쌓이는 구조, 감정적인 관계보다 역할과 기준이 명확한 협업을 선택할수록 강점이 살아납니다.`]
      ];
      document.querySelector("#sections").innerHTML=sections.map(([t,b])=>`<article class="section"><h2>${t}</h2><p>${b}</p></article>`).join("");
      document.querySelector("#result").style.display="block";
      document.querySelector("#result").scrollIntoView({behavior:"smooth"});
    }catch(err){alert("분석 중 오류가 발생했습니다. 입력값을 확인해 주세요.");console.error(err)}
  });
</script>
</body>
</html>
